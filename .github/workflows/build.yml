name: Build Switch Overlay

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build overlay with devkitPro
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/overlay devkitpro/devkita64:latest bash -c "make clean && make"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translatenx-arabic
          path: overlay/*.ovl
