name: Build Switch Overlay

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build overlay using devkitPro
        run: |
          docker run --rm -v ${{ github.workspace }}:/source devkitpro/devkita64:latest bash -c "cd /source/overlay && make clean && make"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translatenx-arabic
          path: overlay/translatenx.ovl
